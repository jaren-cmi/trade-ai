# 数据源配置 - A股智能选股

# AKShare 数据源（主数据源，免费，无需注册/Token）
akshare:
  enabled: true
  max_workers: 5          # 并发线程数（AKShare 基于 HTTP，可适当提高）
  request_timeout: 30     # 单请求超时秒数
  max_retries: 2          # 单股最大重试次数
  rate_limit_sleep: 0.3   # 每次请求前最小间隔（秒，用于限速）

# Tavily 新闻情绪API（可选，默认关闭）
tavily:
  enabled: false
  api_key: ""  # 环境变量 TAVILY_API_KEY
  max_news: 5
  language: "zh"
